name: chart-publish

# Reusable chart publish pipeline (workflow_call). Invoked by release.yml for
# each chart path in a release, and by chart-release.yaml (workflow_dispatch)
# as the manual repair path.

on:
  workflow_call:
    inputs:
      chart-path:
        description: 'Chart path to publish, e.g. charts/inari-server'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v4
        with:
          version: v3.18.6

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.7.0
        with:
          version: v3.12.0

      - name: Resolve chart name and version
        id: chart
        run: |
          CHART_PATH="${{ inputs.chart-path }}"
          test -f "$CHART_PATH/Chart.yaml" || { echo "no Chart.yaml at $CHART_PATH"; exit 1; }
          echo "name=$(basename "$CHART_PATH")" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r '."'$CHART_PATH'"' .release-please-manifest.json)" >> "$GITHUB_OUTPUT"

      - name: chart-testing lint
        run: ct lint --config ct.yaml --charts "${{ inputs.chart-path }}" --validate-maintainers=false

      - name: Package chart
        run: |
          mkdir -p dist
          helm package "${{ inputs.chart-path }}" -d dist

      - name: Verify package version matches manifest
        run: |
          ls "dist/${{ steps.chart.outputs.name }}-${{ steps.chart.outputs.version }}.tgz"

      - name: Login to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push chart as OCI artifact
        run: helm push "dist/${{ steps.chart.outputs.name }}-${{ steps.chart.outputs.version }}.tgz" oci://ghcr.io/7k-inari/${{ github.event.repository.name }}/charts

      - name: Verify published chart
        run: |
          TAG="${{ steps.chart.outputs.version }}"
          for i in $(seq 1 12); do
            if helm show chart "oci://ghcr.io/7k-inari/${{ github.event.repository.name }}/charts/${{ steps.chart.outputs.name }}" --version "$TAG" > /dev/null 2>&1; then
              echo "Published ${{ steps.chart.outputs.name }}:$TAG verified"
              exit 0
            fi
            sleep 5
          done
          echo "::error::chart not visible in GHCR after push"
          exit 1
