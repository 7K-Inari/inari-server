name: chart-release

# Repair path only (still workflow-driven): force-publish a single chart whose
# publish job previously failed after the release was already tagged.
# Normal chart publishing runs from release.yml — the sole release-please
# detector on push to main — so server and chart publishes cannot race each
# other. The actual pipeline lives in the reusable chart-publish.yml.
on:
  workflow_dispatch:
    inputs:
      chart-path:
        description: 'Chart path to (re)publish, e.g. charts/inari-server'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    uses: ./.github/workflows/chart-publish.yml
    with:
      chart-path: ${{ inputs.chart-path }}
