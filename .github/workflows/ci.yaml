name: ci

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths-ignore:
      - "**.md"
  # Merge queue on main (H3): triggers for gh-readonly-queue/** staging
  # branches. Check names are job-derived (not ref-derived), so the required
  # checks configured for PRs apply unchanged to merge-queue runs. Enabling
  # the queue itself is a repo-admin branch-protection toggle — see AGENTS.md.
  merge_group:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Go build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/go-build
          key: go-build-lint-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-build-lint-${{ runner.os }}-
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.14.0
      - name: actionlint
        run: make actionlint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Go build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/go-build
          key: go-build-test-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-build-test-${{ runner.os }}-
      - name: install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0
      - name: unit tests
        run: gotestsum --junitfile unit-tests.xml --format-hide-empty-pkg -- -count=1 ./...
      - name: upload JUnit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: junit-unit
          path: unit-tests.xml
          retention-days: 14

  integration:
    runs-on: ubuntu-latest
    # actions: read lets the timing step download JUnit artifacts from the
    # last successful ci run on the base branch (H2 timing-based sharding).
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        shard: [critical, core-services, modules-a, modules-b]
    env:
      # Race-detect the critical shard only (db, leaderlease, eventbus, audit,
      # authz, orchestrator, approvals) — empty for the other shards.
      RACE: ${{ matrix.shard == 'critical' && '-race' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Go build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/go-build
          key: go-build-integration-${{ matrix.shard }}-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-build-integration-${{ matrix.shard }}-${{ runner.os }}-
      - name: install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0
      - name: shard map covers all integration packages
        run: scripts/integration-shards.sh verify
      - name: download timing history from last successful ci run
        # Downloads ALL junit-integration-* artifacts (not just this shard's):
        # after a rebalance, a package new to this shard has no timing in this
        # shard's own history, so per-shard downloads would leave rebalanced
        # packages untimed (packed as 0s) until they cycled every shard.
        # Soft-fail by design: cold start / missing artifacts / fork PR all
        # fall back to the static shard map inside integration-shards.sh.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="${{ github.base_ref || github.ref_name }}"
          run_id=$(gh run list --workflow ci --branch "$base" --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -n "$run_id" ] && [ "$run_id" != "null" ]; then
            gh run download "$run_id" -D .ci-timing
          fi
      - name: integration tests (${{ matrix.shard }})
        env:
          # CI-only: containers die with the ephemeral runner job, so Ryuk's
          # per-container reaper latency is skipped. Keep Ryuk ENABLED for
          # local runs (this var is intentionally not set anywhere else).
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: |
          race=()
          if [ -n "$RACE" ]; then race=("$RACE"); fi
          read -r -a pkgs <<<"$(scripts/integration-shards.sh balance ${{ matrix.shard }} .ci-timing)"
          # -shuffle=on surfaces order-dependent tests in PR CI; go test logs
          # the seed on failure so a repro is one flag away.
          gotestsum --junitfile integration-${{ matrix.shard }}.xml --format-hide-empty-pkg -- -tags=integration -shuffle=on -count=1 "${race[@]}" "${pkgs[@]}"
      - name: upload JUnit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: junit-integration-${{ matrix.shard }}
          path: integration-${{ matrix.shard }}.xml
          retention-days: 14

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: build both image targets
        run: |
          docker build --target server -f deploy/docker/Dockerfile -t inari/server:ci .
          docker build --target kubeproxy -f deploy/docker/Dockerfile -t inari/kubeproxy:ci .
      - name: assert entrypoints
        run: |
          srv=$(docker inspect -f '{{.Config.Entrypoint}}' inari/server:ci)
          kp=$(docker inspect -f '{{.Config.Entrypoint}}' inari/kubeproxy:ci)
          echo "server entrypoint:    $srv"
          echo "kubeproxy entrypoint: $kp"
          [ "$srv" = "[/inari-server]" ] || { echo "server image has wrong entrypoint"; exit 1; }
          [ "$kp" = "[/inari-kubeproxy]" ] || { echo "kubeproxy image has wrong entrypoint"; exit 1; }

  openapi-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Go build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/go-build
          key: go-build-openapi-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-build-openapi-${{ runner.os }}-
      - name: export spec offline
        run: make export-openapi
      - name: spec is non-empty and complete
        run: go test ./cmd/export-openapi/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openapi
          path: dist/openapi.yaml
