name: ci

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths-ignore:
      - "**.md"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go build cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-build-lint-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-build-lint-${{ runner.os }}-
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.14.0

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go build cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-build-test-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-build-test-${{ runner.os }}-
      - run: go test ./...

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [critical, core-services, modules-a, modules-b]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go build cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-build-integration-${{ matrix.shard }}-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-build-integration-${{ matrix.shard }}-${{ runner.os }}-
      - name: shard map covers all integration packages
        run: scripts/integration-shards.sh verify
      - name: integration tests (${{ matrix.shard }})
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: go test -tags=integration -count=1 $(scripts/integration-shards.sh packages ${{ matrix.shard }})

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -f deploy/docker/Dockerfile -t inari/server:ci .

  openapi-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go build cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-build-openapi-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-build-openapi-${{ runner.os }}-
      - name: export spec offline
        run: make export-openapi
      - name: spec is non-empty and complete
        run: go test ./cmd/export-openapi/
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: dist/openapi.yaml
