name: ci

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths-ignore:
      - "**.md"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Go build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/go-build
          key: go-build-lint-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-build-lint-${{ runner.os }}-
      - uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: v2.14.0
      - name: actionlint
        run: make actionlint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Go build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/go-build
          key: go-build-test-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-build-test-${{ runner.os }}-
      - name: install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0
      - name: unit tests
        run: gotestsum --junitfile unit-tests.xml --format-hide-empty-pkg -- -count=1 ./...
      - name: upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-unit
          path: unit-tests.xml
          retention-days: 14

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [critical, core-services, modules-a, modules-b]
    env:
      # Race-detect the critical shard only (db, leaderlease, eventbus, audit,
      # authz, orchestrator, approvals) — empty for the other shards.
      RACE: ${{ matrix.shard == 'critical' && '-race' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go build cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-build-integration-${{ matrix.shard }}-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-build-integration-${{ matrix.shard }}-${{ runner.os }}-
      - name: install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0
      - name: shard map covers all integration packages
        run: scripts/integration-shards.sh verify
      - name: integration tests (${{ matrix.shard }})
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: |
          race=()
          if [ -n "$RACE" ]; then race=("$RACE"); fi
          read -r -a pkgs <<<"$(scripts/integration-shards.sh packages ${{ matrix.shard }})"
          gotestsum --junitfile integration-${{ matrix.shard }}.xml --format-hide-empty-pkg -- -tags=integration -count=1 "${race[@]}" "${pkgs[@]}"
      - name: upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-integration-${{ matrix.shard }}
          path: integration-${{ matrix.shard }}.xml
          retention-days: 14

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - run: docker build -f deploy/docker/Dockerfile -t inari/server:ci .

  openapi-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Go build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/go-build
          key: go-build-openapi-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-build-openapi-${{ runner.os }}-
      - name: export spec offline
        run: make export-openapi
      - name: spec is non-empty and complete
        run: go test ./cmd/export-openapi/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openapi
          path: dist/openapi.yaml
