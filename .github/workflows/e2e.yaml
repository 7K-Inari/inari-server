name: e2e

# Debug/repair path only: the canonical golden-path e2e is now a
# release-prep gate in inari-release-bundle. This workflow is retained
# solely for manual runs (workflow_dispatch) to debug or repair the
# kind-based platform stack when the bundle gate fails.

on:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Build-once (O3): the server and agent images are built exactly once,
    # with buildx GHA caching, and exported as a docker-save tar artifact the
    # golden-path matrix legs download and `docker load`. The matrix no
    # longer rebuilds the same images per HA leg.
    name: build images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve matching inari-agent ref
        id: agent
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          BRANCH="$HEAD_REF"
          if git ls-remote --exit-code https://github.com/7K-Inari/inari-agent.git "refs/heads/$BRANCH" >/dev/null 2>&1; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout inari-agent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 7K-Inari/inari-agent
          ref: ${{ steps.agent.outputs.ref }}
          path: inari-agent

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build server image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          tags: inari/server:e2e
          push: false
          load: true
          cache-from: type=gha,scope=e2e-server
          cache-to: type=gha,mode=max,scope=e2e-server

      - name: Build agent image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./inari-agent
          file: inari-agent/Dockerfile
          tags: inari/agent:e2e
          push: false
          load: true
          cache-from: type=gha,scope=e2e-agent
          cache-to: type=gha,mode=max,scope=e2e-agent

      - name: Export images to tar
        run: docker save -o e2e-images.tar inari/server:e2e inari/agent:e2e

      - name: Upload image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-images
          path: e2e-images.tar
          if-no-files-found: error
          retention-days: 1

  golden-path:
    # Two legs: the default single-replica fast gate, and the HA gate
    # (INARI_HA=true — 2x server/OpenFGA replicas + disruption assertions:
    # pod kill, rollout restart under traffic, migration-lock race,
    # leader-lease single-execution, agent stream fencing). The HA leg
    # adds ~10 minutes (extra replica, redis subchart, bounded traffic
    # windows), so it gets a larger but still bounded timeout.
    needs: build
    strategy:
      fail-fast: false
      matrix:
        ha: [false, true]
    name: golden-path (INARI_HA=${{ matrix.ha }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.ha && 60 || 45 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-images

      - name: Load prebuilt images
        run: docker load -i e2e-images.tar

      # The golden path still helm-installs the agent from the inari-agent
      # repo's chart (deployed separately from the prebuilt image), so each
      # matrix leg needs its own checkout of that repo for the chart only.
      - name: Resolve matching inari-agent ref
        id: agent
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          BRANCH="$HEAD_REF"
          if git ls-remote --exit-code https://github.com/7K-Inari/inari-agent.git "refs/heads/$BRANCH" >/dev/null 2>&1; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout inari-agent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 7K-Inari/inari-agent
          ref: ${{ steps.agent.outputs.ref }}
          path: inari-agent

      - name: Resolve matching inari-release-bundle ref
        id: chart
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          # The repo rename inari-helm-charts -> inari-release-bundle is a
          # pending admin step; fall back to the old name until it lands.
          REPO="7K-Inari/inari-release-bundle"
          if ! git ls-remote --exit-code "https://github.com/$REPO.git" HEAD >/dev/null 2>&1; then
            REPO="7K-Inari/inari-helm-charts"
          fi
          BRANCH="$HEAD_REF"
          if git ls-remote --exit-code "https://github.com/$REPO.git" "refs/heads/$BRANCH" >/dev/null 2>&1; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "path=$(basename "$REPO")" >> "$GITHUB_OUTPUT"

      - name: Checkout inari-release-bundle
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.chart.outputs.repo }}
          ref: ${{ steps.chart.outputs.ref }}
          path: ${{ steps.chart.outputs.path }}

      - name: Create kind cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: inari-e2e
          wait: 60s

      - name: Run golden path
        # KEEP_CLUSTER=true: the workflow owns teardown (final step) so the
        # diagnostics step still has a cluster to inspect on failure.
        run: HELM_CHARTS_DIR=${{ steps.chart.outputs.path }} KEEP_CLUSTER=true INARI_HA=${{ matrix.ha }} bash e2e/golden-path.sh

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          kubectl config use-context kind-inari-e2e || true
          kubectl -n inari get pods || true
          kubectl -n inari logs -l app.kubernetes.io/name=inari-server --prefix --tail=100 || true
          kubectl -n inari-system logs deployment/inari-agent --tail=100 || true
          if [ "${{ matrix.ha }}" = "true" ]; then
            kubectl -n inari get pdb,deployment inari-server -o wide || true
            PRIMARY=$(kubectl -n inari get cluster.postgresql.cnpg.io/postgresql -o jsonpath='{.status.currentPrimary}' 2>/dev/null || true)
            if [ -n "$PRIMARY" ]; then
              URI=$(kubectl -n inari get secret inari-db -o jsonpath='{.data.inari-uri}' | base64 -d)
              kubectl -n inari exec "$PRIMARY" -c postgres -- psql "$URI" -c 'SELECT name, holder, expires_at FROM leader_leases' || true
            fi
          fi

      - name: Delete kind cluster
        if: always()
        run: kind delete cluster --name inari-e2e || true
