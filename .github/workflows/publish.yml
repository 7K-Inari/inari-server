name: publish

on:
  workflow_call:
    inputs:
      version:
        description: Semver version to publish (e.g. 0.2.1), without leading v
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE: ghcr.io/7k-inari/inari-server

jobs:
  # Publish the huma-generated OpenAPI contract as an OCI artifact so the
  # inari-ui (and any other client) can codegen TypeScript types from the
  # exact released schema instead of hand-maintained copies (the drift
  # class behind e.g. 422 "unexpected property" in production).
  openapi:
    runs-on: ubuntu-latest
    env:
      SPEC_IMAGE: ghcr.io/7k-inari/inari-server-openapi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: render spec
        run: make export-openapi

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2

      - name: push spec to GHCR
        id: push
        run: |
          major_minor="${VERSION%.*}"
          for tag in "${VERSION}" "${major_minor}" "latest"; do
            out="$(oras push "${SPEC_IMAGE}:${tag}" \
              dist/openapi.yaml:application/vnd.oai.openapi+yaml)"
            echo "${out}"
            if [ "${tag}" = "${VERSION}" ]; then
              echo "digest=$(echo "${out}" | grep -oE 'sha256:[a-f0-9]{64}' | tail -1)" >> "$GITHUB_OUTPUT"
            fi
          done
        env:
          SPEC_IMAGE: ${{ env.SPEC_IMAGE }}
          VERSION: ${{ inputs.version }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: sign spec (keyless)
        run: cosign sign --yes ${{ env.SPEC_IMAGE }}@${{ steps.push.outputs.digest }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: image tags
        id: tags
        run: |
          major_minor="${VERSION%.*}"
          {
            echo "tags<<EOF"
            echo "${IMAGE}:${VERSION}"
            echo "${IMAGE}:${major_minor}"
            echo "${IMAGE}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        env:
          IMAGE: ${{ env.IMAGE }}
          VERSION: ${{ inputs.version }}

      - name: build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}

      - name: SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: sign image (keyless)
        run: cosign sign --yes ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}

      - name: attest SBOM
        run: cosign attest --yes --predicate sbom.spdx.json --type spdxjson ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}

      - name: attest SLSA provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # Kubectl gateway data plane (ADR-0014): same Dockerfile, kubeproxy target,
  # same version tags as the server image — the inari-server chart's
  # kubeproxy.image.tag defaults to the chart appVersion.
  build-kubeproxy:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/7k-inari/inari-kubeproxy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: image tags
        id: tags
        run: |
          major_minor="${VERSION%.*}"
          {
            echo "tags<<EOF"
            echo "${IMAGE}:${VERSION}"
            echo "${IMAGE}:${major_minor}"
            echo "${IMAGE}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        env:
          IMAGE: ${{ env.IMAGE }}
          VERSION: ${{ inputs.version }}

      - name: build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: kubeproxy
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}

      - name: SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: sign image (keyless)
        run: cosign sign --yes ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}

      - name: attest SBOM
        run: cosign attest --yes --predicate sbom.spdx.json --type spdxjson ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}

      - name: attest SLSA provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
