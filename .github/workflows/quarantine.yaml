name: flaky-quarantine

# Nightly, non-blocking: runs only tests tagged `//go:build flaky` (H7
# quarantine escape hatch) and files/updates one issue per failing test.
# Scheduled runs never gate PRs; nothing in this repo `needs:` this workflow.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quarantine:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a3267505838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Go build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/go-build
          key: go-build-quarantine-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-build-quarantine-${{ runner.os }}-
      - name: install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0
      - name: compile guard for the flaky build tag
        # Surfaces a broken `//go:build flaky` constraint quickly. Packages
        # without any flaky-tagged file are simply skipped by the build
        # constraints, so this is advisory rather than a hard gate.
        continue-on-error: true
        run: go vet -tags flaky ./...
      - name: run flaky-tagged tests
        # Always succeeds at the step level: the report step decides what to
        # file. TESTCONTAINERS_RYUK_DISABLED is CI-only (containers die with
        # the ephemeral runner); local runs keep Ryuk enabled.
        continue-on-error: true
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: |
          gotestsum --junitfile flaky.xml --format-hide-empty-pkg -- \
            -tags="integration,flaky" -shuffle=on -count=1 ./...
      - name: upload JUnit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: junit-flaky
          path: flaky.xml
          retention-days: 14
      - name: file or update issues for failing flaky tests
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/quarantine-report.sh flaky.xml "$RUN_URL"
