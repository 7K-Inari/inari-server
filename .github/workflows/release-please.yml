name: release-please

# Maintains the Release PR (version bump + CHANGELOG) on every merge to main.
# PR-only mode: this workflow never tags or releases anything. Merging the
# Release PR is the human gate; release.yml performs the actual release.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
