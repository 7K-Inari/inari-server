name: release

# Detects a merged Release PR (release-please action self-detection — robust
# under merge-commit and squash alike), creates tag + GitHub Release, then
# runs the publish jobs gated on the action's outputs. No tag-push triggers,
# no manual releases.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

  publish:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    uses: ./.github/workflows/publish.yml
    with:
      version: ${{ needs.release.outputs.version }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
