name: release

# Detects a merged Release PR (release-please action self-detection — robust
# under merge-commit and squash alike), creates tag + GitHub Release, then
# runs the publish jobs gated on the action's outputs. No tag-push triggers,
# no manual releases.
#
# Sole release-please detector on push to main. The Helm chart lives in
# 7K-Inari/inari-release-bundle now — chart versioning/publishing happens
# there; this workflow only notifies it (chart-sync job) after a release.

on:
  push:
    branches: [main]
  workflow_dispatch:
    # Repair path (still workflow-driven): re-publish the server artifacts and
    # all charts for an already-tagged version whose publish jobs failed or
    # were skipped, e.g. after fixing the pipeline. Run with the release tag
    # as the workflow ref so the built artifacts match the release exactly:
    #   gh workflow run release.yml --ref vX.Y.Z -f version=X.Y.Z
    inputs:
      version:
        description: 'Already-released version to (re)publish, e.g. 1.6.0'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
      paths_released: ${{ steps.rp.outputs.paths_released }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

  publish:
    needs: release
    if: always() && (github.event_name == 'workflow_dispatch' || needs.release.outputs.release_created == 'true')
    uses: ./.github/workflows/publish.yml
    with:
      version: ${{ github.event_name == 'workflow_dispatch' && inputs.version || needs.release.outputs.version }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

  # The chart lives in 7K-Inari/inari-release-bundle now: notify it so its
  # chart-sync workflow bumps charts/inari-server appVersion (chart releases
  # in lockstep via release-please there). Best-effort: a failed dispatch is
  # repairable via the bundle repo's chart-sync workflow_dispatch.
  chart-sync:
    needs: [release, publish]
    if: always() && (github.event_name == 'workflow_dispatch' || needs.release.outputs.release_created == 'true') && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch appversion-bump to inari-release-bundle
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || needs.release.outputs.version }}
        run: |
          test -n "$VERSION" || { echo "::error::no version resolved"; exit 1; }
          gh api repos/7K-Inari/inari-release-bundle/dispatches \
            -f event_type=appversion-bump \
            -F "client_payload[chart]=inari-server" \
            -F "client_payload[version]=${VERSION}"
