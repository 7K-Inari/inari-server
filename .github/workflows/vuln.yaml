name: vuln

# Vulnerability scanning — intentionally NOT triggered on pull_request so it
# can never block PRs. Runs weekly plus on demand (repair path).
on:
  schedule:
    - cron: "17 6 * * 1" # weekly, Monday 06:17 UTC (off-peak)
  workflow_dispatch:

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          check-latest: true
