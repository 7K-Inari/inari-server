name: vuln

# Vulnerability scanning — intentionally NOT triggered on pull_request so it
# can never block PRs. Runs weekly plus on demand (repair path).
on:
  schedule:
    - cron: "17 6 * * 1" # weekly, Monday 06:17 UTC (off-peak)
  workflow_dispatch:

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          check-latest: true
