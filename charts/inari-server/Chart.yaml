apiVersion: v2
name: inari-server
description: >-
  Inari control-plane API server (inari-server) — tenant/org management,
  catalog, resources inventory.
type: application
version: 0.1.9
appVersion: 3.0.0
maintainers:
  - name: 7K-Inari
    url: https://github.com/7K-Inari
# Optional in-cluster Redis for the cache layer (ADR-0010). Disabled by
# default; enable with --set redis.enabled=true (or set cache.backend=redis
# with redis.url for an external instance).
# In-cluster NATS JetStream event bus (ADR-0014). ENABLED by default
# (single-node dev posture) because the server refuses to boot without it;
# production sets nats.enabled=false + nats.url for an external cluster.
dependencies:
  - name: redis
    version: 28.2.4
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: nats
    version: 1.3.2
    repository: https://nats-io.github.io/k8s/helm/charts
    condition: nats.enabled
