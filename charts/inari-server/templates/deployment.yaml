apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "inari-server.fullname" . }}
  labels:
    {{- include "inari-server.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "inari-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "inari-server.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "inari-server.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- if and .Values.podAntiAffinity.enabled (ge (int .Values.replicaCount) 2) }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "inari-server.selectorLabels" . | nindent 20 }}
                topologyKey: {{ .Values.podAntiAffinity.topologyKey }}
      {{- end }}
      {{- if .Values.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpreadConstraints.maxSkew }}
          topologyKey: {{ .Values.topologySpreadConstraints.topologyKey }}
          whenUnsatisfiable: {{ .Values.topologySpreadConstraints.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "inari-server.selectorLabels" . | nindent 14 }}
      {{- end }}
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
          env:
            - name: INARI_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secret.name }}
                  key: {{ .Values.database.secret.uriKey }}
            - name: INARI_OPENFGA_API_URL
              value: {{ .Values.openfga.url | quote }}
            - name: INARI_OIDC_ISSUER_URL
              value: {{ include "inari-server.oidcIssuerUrl" . | quote }}
            - name: INARI_KEYCLOAK_BASE_URL
              value: {{ .Values.keycloak.baseUrl | quote }}
            - name: INARI_KEYCLOAK_REALM
              value: {{ .Values.keycloak.realm | quote }}
            - name: INARI_PLATFORM_ADMIN_ROLE
              value: {{ .Values.keycloak.adminRole | quote }}
            - name: INARI_KEYCLOAK_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.adminSecret.name }}
                  key: {{ .Values.keycloak.adminSecret.clientIdKey }}
            - name: INARI_KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.adminSecret.name }}
                  key: {{ .Values.keycloak.adminSecret.clientSecretKey }}
            {{- if .Values.vault.addr }}
            - name: INARI_VAULT_ADDR
              value: {{ .Values.vault.addr | quote }}
            - name: INARI_VAULT_KV_MOUNT
              value: {{ .Values.vault.kvMount | quote }}
            - name: INARI_VAULT_AUTH_METHOD
              value: {{ .Values.vault.authMethod | default "token" | quote }}
            {{- if eq (.Values.vault.authMethod | default "token") "kubernetes" }}
            - name: INARI_VAULT_K8S_ROLE
              value: {{ required "vault.role is required when vault.authMethod=kubernetes" .Values.vault.role | quote }}
            {{- else }}
            - name: INARI_VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.vault.tokenSecret.name }}
                  key: {{ .Values.vault.tokenSecret.tokenKey }}
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.extraVolumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
