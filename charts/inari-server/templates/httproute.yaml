{{- if .Values.route.enabled }}
{{- $gateway := .Values.gateway }}
{{- if not $gateway.name }}
{{- fail "gateway.name is required when route.enabled=true — the chart does not create a Gateway; point gateway.name at the Gateway you have already deployed" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "inari-server.fullname" . }}
  {{- with .Values.route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "inari-server.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $gateway.name }}
      {{- with $gateway.namespace }}
      namespace: {{ . }}
      {{- end }}
      {{- with $gateway.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  {{- with .Values.route.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        {{- with .Values.route.pathPrefix }}
        - path:
            type: PathPrefix
            value: {{ . | quote }}
        {{- else }}
        []
        {{- end }}
      backendRefs:
        - name: {{ include "inari-server.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
# Agent Gateway route: hostnames routed wholly to inari-server so agents can
# reach the ConnectRPC services (/inari.agent.v1.*) over the public internet.
# A dedicated hostname is required because Gateway API PathPrefix matches are
# segment-based: a partial segment like "/inari." never matches
# "/inari.agent.v1.…" (verified on Istio 1.29; both PathPrefix and
# RegularExpression fall through to the catch-all route).
{{- if and .Values.route.enabled .Values.route.agentHostnames }}
{{- $gateway := .Values.gateway }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "inari-server.fullname" . }}-agent
  {{- with .Values.route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "inari-server.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $gateway.name }}
      {{- with $gateway.namespace }}
      namespace: {{ . }}
      {{- end }}
      {{- with $gateway.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  hostnames:
    {{- toYaml .Values.route.agentHostnames | nindent 4 }}
  rules:
    - backendRefs:
        - name: {{ include "inari-server.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
