suite: inari-server
templates:
  - deployment.yaml
  - service.yaml
  - serviceaccount.yaml
  - httproute.yaml
  - pdb.yaml
tests:
  - it: renders Deployment, Service and ServiceAccount by default
    asserts:
      - hasDocuments:
          count: 1
    template: deployment.yaml
  - it: renders the Deployment with the appVersion image by default
    template: deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - matchRegex:
          # Tag must come from Chart appVersion but must not be hardcoded
          # here — every server release would re-break this assertion.
          path: spec.template.spec.containers[0].image
          pattern: ^ghcr\.io/7k-inari/inari-server:.+$
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: inari-server
  - it: uses an explicit image tag when set
    template: deployment.yaml
    set:
      image.tag: "9.9.9"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/7k-inari/inari-server:9.9.9
  - it: sources the database uri from a secret, not plaintext
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[0].name
          value: INARI_DATABASE_URL
      - equal:
          path: spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.name
          value: inari-db
      - equal:
          path: spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.key
          value: inari-uri
  - it: passes the default platform admin role
    template: deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INARI_PLATFORM_ADMIN_ROLE
            value: inari-platform-admin
  - it: passes an overridden platform admin role
    template: deployment.yaml
    set:
      keycloak.adminRole: custom-admin
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INARI_PLATFORM_ADMIN_ROLE
            value: custom-admin
  - it: derives the OIDC issuer URL from keycloak baseUrl+realm
    template: deployment.yaml
    set:
      keycloak.baseUrl: https://auth.example.org
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INARI_OIDC_ISSUER_URL
            value: https://auth.example.org/realms/inari
  - it: honors an explicit OIDC issuer URL
    template: deployment.yaml
    set:
      keycloak.baseUrl: https://auth.example.org
      oidc.issuerUrl: https://alias.example.org/realms/inari
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INARI_OIDC_ISSUER_URL
            value: https://alias.example.org/realms/inari
  - it: renders no Vault env without vault.addr
    template: deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: INARI_VAULT_ADDR
  - it: renders Vault env with the token sourced from a secret
    template: deployment.yaml
    set:
      vault.addr: https://vault.example.org
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INARI_VAULT_ADDR
            value: https://vault.example.org
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INARI_VAULT_KV_MOUNT
            value: secret
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INARI_VAULT_TOKEN
            valueFrom:
              secretKeyRef:
                name: inari-vault
                key: token
  - it: renders kubernetes Vault auth without a token secret
    template: deployment.yaml
    set:
      vault.addr: https://vault.example.org
      vault.authMethod: kubernetes
      vault.role: inari-server
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INARI_VAULT_AUTH_METHOD
            value: kubernetes
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INARI_VAULT_K8S_ROLE
            value: inari-server
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: INARI_VAULT_TOKEN
  - it: fails when kubernetes auth has no role
    template: deployment.yaml
    set:
      vault.addr: https://vault.example.org
      vault.authMethod: kubernetes
    asserts:
      - failedTemplate:
          errorMessage: vault.role is required when vault.authMethod=kubernetes
  - it: renders a Service
    template: service.yaml
    asserts:
      - isKind:
          of: Service
      - equal:
          path: spec.ports[0].port
          value: 8080
  - it: renders a ServiceAccount
    template: serviceaccount.yaml
    asserts:
      - isKind:
          of: ServiceAccount
  - it: renders no HTTPRoute by default
    template: httproute.yaml
    asserts:
      - hasDocuments:
          count: 0
  - it: fails when route is enabled without a gateway name
    template: httproute.yaml
    set:
      route.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: gateway.name is required when route.enabled=true — the chart does not create a Gateway; point gateway.name at the Gateway you have already deployed
  - it: renders an HTTPRoute with a configured gateway
    template: httproute.yaml
    set:
      route.enabled: true
      gateway.name: platform-gateway
      route.hostnames:
        - api.example.org
    asserts:
      - isKind:
          of: HTTPRoute
      - equal:
          path: spec.parentRefs[0].name
          value: platform-gateway
      - equal:
          path: spec.hostnames[0]
          value: api.example.org
      - equal:
          path: spec.rules[0].backendRefs[0].port
          value: 8080
  - it: renders no agent HTTPRoute by default
    template: httproute.yaml
    set:
      route.enabled: true
      gateway.name: platform-gateway
    asserts:
      - hasDocuments:
          count: 1
  - it: renders a second agent HTTPRoute for agentHostnames
    template: httproute.yaml
    set:
      route.enabled: true
      gateway.name: platform-gateway
      route.agentHostnames:
        - inari-gw.example.org
    documentIndex: 1
    asserts:
      - isKind:
          of: HTTPRoute
      - equal:
          path: metadata.name
          value: RELEASE-NAME-inari-server-agent
      - equal:
          path: spec.hostnames[0]
          value: inari-gw.example.org
      - equal:
          path: spec.rules[0].backendRefs[0].name
          value: RELEASE-NAME-inari-server
      - equal:
          path: spec.rules[0].backendRefs[0].port
          value: 8080
  - it: leaves the public HTTPRoute untouched when agentHostnames is set
    template: httproute.yaml
    set:
      route.enabled: true
      gateway.name: platform-gateway
      route.hostnames:
        - api.example.org
      route.agentHostnames:
        - inari-gw.example.org
    documentIndex: 0
    asserts:
      - equal:
          path: spec.hostnames[0]
          value: api.example.org
  - it: mounts extra volumes for the local git provider (dev/e2e)
    template: deployment.yaml
    set:
      extraVolumes:
        - name: git-repos
          hostPath:
            path: /git
      extraVolumeMounts:
        - name: git-repos
          mountPath: /var/lib/inari/git
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].name
          value: git-repos
      - equal:
          path: spec.template.spec.volumes[0].hostPath.path
          value: /git
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: /var/lib/inari/git
  - it: renders no volumes by default
    template: deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.volumes
  - it: wires readiness, liveness and startup probes to the health endpoints by default
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /readyz
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: http
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: http
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.port
          value: http
  - it: honors probe parameter overrides
    template: deployment.yaml
    set:
      probes.readiness.periodSeconds: 3
      probes.readiness.timeoutSeconds: 5
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.periodSeconds
          value: 3
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.timeoutSeconds
          value: 5
  - it: omits a probe when its enabled flag is false
    template: deployment.yaml
    set:
      probes.startup.enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].startupProbe
      - exists:
          path: spec.template.spec.containers[0].readinessProbe
      - exists:
          path: spec.template.spec.containers[0].livenessProbe
  - it: renders a surge-only rolling update strategy and grace period by default
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.strategy.rollingUpdate.maxUnavailable
          value: 0
      - equal:
          path: spec.strategy.rollingUpdate.maxSurge
          value: 1
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 30
  - it: renders default resource requests and limits
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 100m
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 128Mi
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 512Mi
  - it: honors resource overrides
    template: deployment.yaml
    set:
      resources.requests.cpu: 250m
      resources.limits.memory: 1Gi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 250m
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 1Gi
  - it: renders no PDB by default (single replica)
    template: pdb.yaml
    asserts:
      - hasDocuments:
          count: 0
  - it: renders a PDB when replicaCount >= 2
    template: pdb.yaml
    set:
      replicaCount: 2
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: spec.minAvailable
          value: 1
  - it: "rejects replicaCount 0 via the values schema (minimum 1)"
    template: deployment.yaml
    set:
      replicaCount: 0
    # helm-unittest cannot assert JSON-schema failures (they abort the run,
    # not the template): this test documents the constraint and is skipped;
    # the schema itself is enforced by helm lint/ct lint in CI.
    skip:
      reason: "schema-level rejection (helm-unittest cannot assert JSON-schema failures); the minimum is enforced by helm lint/ct lint in CI and was verified live in run 423ffd13"
    asserts:
      - failedTemplate:
          errorMessage: minimum
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: inari-server
  - it: renders no PDB when pdb.enabled is false despite replicaCount >= 2
    template: pdb.yaml
    set:
      replicaCount: 2
      pdb.enabled: false
    asserts:
      - hasDocuments:
          count: 0
  - it: renders no anti-affinity by default (single replica)
    template: deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.affinity
  - it: renders preferred hostname anti-affinity when replicaCount >= 2
    template: deployment.yaml
    set:
      replicaCount: 2
    asserts:
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].weight
          value: 100
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].podAffinityTerm.topologyKey
          value: kubernetes.io/hostname
  - it: renders no anti-affinity when podAntiAffinity.enabled is false despite replicaCount >= 2
    template: deployment.yaml
    set:
      replicaCount: 2
      podAntiAffinity.enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.affinity
  - it: renders no topologySpreadConstraints by default
    template: deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.topologySpreadConstraints
  - it: renders topologySpreadConstraints when opted in
    template: deployment.yaml
    set:
      replicaCount: 2
      topologySpreadConstraints.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].maxSkew
          value: 1
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].topologyKey
          value: topology.kubernetes.io/zone
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].whenUnsatisfiable
          value: ScheduleAnyway
  - it: defaults the cache backend to memory without a Redis URL
    template: deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INARI_CACHE_BACKEND
            value: memory
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: INARI_REDIS_URL
  - it: renders the subchart Redis URL when cache.backend=redis and redis.enabled
    template: deployment.yaml
    set:
      cache.backend: redis
      redis.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INARI_CACHE_BACKEND
            value: redis
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INARI_REDIS_URL
            value: redis://RELEASE-NAME-inari-server-redis-master:6379/0
  - it: honors an external Redis URL when cache.backend=redis
    template: deployment.yaml
    set:
      cache.backend: redis
      redis.url: redis://cache.example.com:6379/2
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INARI_REDIS_URL
            value: redis://cache.example.com:6379/2
  - it: fails when cache.backend=redis has neither subchart nor external URL
    template: deployment.yaml
    set:
      cache.backend: redis
    asserts:
      - failedTemplate:
          errorMessage: cache.backend=redis requires redis.enabled=true (subchart) or redis.url (external Redis)
