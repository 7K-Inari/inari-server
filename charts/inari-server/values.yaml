# Default values for inari-server.

replicaCount: 1

image:
  repository: ghcr.io/7k-inari/inari-server
  # Defaults to the chart's appVersion when empty; release-please keeps
  # appVersion aligned with the released server image.
  tag: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

# PostgreSQL connection. The URI is read from a secret key, never plaintext.
database:
  secret:
    name: inari-db
    uriKey: inari-uri

# OpenFGA authorization service endpoint.
openfga:
  url: http://openfga:8080

# OIDC issuer for token validation. Defaults to
# <keycloak.baseUrl>/realms/<keycloak.realm> when empty.
oidc:
  issuerUrl: ""

keycloak:
  # Base URL of the platform Keycloak (used for the derived issuer URL and
  # INARI_KEYCLOAK_BASE_URL).
  baseUrl: ""
  realm: inari
  adminRole: inari-platform-admin
  # Secret holding the Keycloak admin client credentials.
  adminSecret:
    name: inari-keycloak-admin
    clientIdKey: client-id
    clientSecretKey: client-secret

# Extra INARI_* env vars, e.g. - name: INARI_AGENT_IMAGE_TAG / value: dev
extraEnv: []

# Extra pod volumes/mounts, e.g. a hostPath for INARI_GIT_PROVIDER=local
# (dev/e2e filesystem git backend).
extraVolumes: []
extraVolumeMounts: []

# Platform Vault for ESO delivery of per-cluster OIDC client secrets
# (registration exchange). Without addr, cluster registration fails
# explicitly with pending_secret_delivery. Vault-side setup (policy,
# Kubernetes auth role): docs/operator-guide/bootstrap.md "Platform Vault
# setup" in inari-docs.
vault:
  addr: ""
  kvMount: secret
  # Auth method: "token" (static token from tokenSecret; expires and needs
  # out-of-band rotation + pod restart) or "kubernetes" (ServiceAccount JWT
  # login; short-lived tokens, re-login on expiry/401 — no secret material).
  authMethod: token
  # Kubernetes auth: Vault role bound to the inari-server ServiceAccount
  # (policy: update on <kvMount>/data/inari/clusters/* only). The auth mount
  # path defaults to "kubernetes" server-side.
  role: ""
  # Token auth: Secret holding the Vault token (policy: update on
  # <kvMount>/data/inari/clusters/* only). Ignored when authMethod=kubernetes.
  tokenSecret:
    name: inari-vault
    tokenKey: token

# Gateway API — parentRef to an ALREADY-EXISTING Gateway. This chart never
# creates a Gateway/GatewayClass: a Gateway must be deployed beforehand.
gateway:
  name: ""
  namespace: ""
  sectionName: ""

# HTTPRoute exposing inari-server via the Gateway referenced in `gateway:`.
route:
  enabled: false
  # e.g. ["api.example.org"]; empty = match all hostnames.
  hostnames: []
  # Optional PathPrefix match; empty = match all paths.
  pathPrefix: ""
  # Dedicated agent-gateway hostnames (e.g. ["inari-gw.example.org"]):
  # rendered as a second HTTPRoute routing ALL paths to inari-server so
  # agent-facing ConnectRPC (/inari.agent.v1.*) is reachable publicly.
  # PathPrefix cannot express this — Gateway API prefixes are segment-based
  # and "/inari." is a partial segment.
  agentHostnames: []
  # Extra annotations (e.g. external-dns/cloudflare-proxy).
  annotations: {}

resources: {}

serviceAccount:
  annotations: {}
