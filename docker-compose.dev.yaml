services:
  postgres:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: inari
      POSTGRES_PASSWORD: inari
      POSTGRES_DB: inari
    ports: ["5432:5432"]

  keycloak:
    image: quay.io/keycloak/keycloak:26.8@sha256:79c623a22abacf3fe6c00a5fb30f5b7843d717b234033b80995891c06116d244
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./deploy/dev/keycloak:/opt/keycloak/data/import:ro
    ports: ["8081:8080"]

  openfga:
    image: openfga/openfga:v1.22@sha256:9cf9a20af32a40434cd3a788c429879439ee9ea9abf65c9c200ee17cd43f769e
    command: run
    ports: ["8082:8080"]

  # NATS JetStream event bus (ADR-0014): obligatory — run the server with
  # INARI_NATS_URL=nats://localhost:4222.
  nats:
    image: nats:2.15-alpine@sha256:2ae57dfba3063d5e25fecb75256118c0882a1a2d2cf7d0fba17a7c701df956f6
    command: ["-js", "-sd", "/data"]
    volumes:
      - nats-data:/data
    ports: ["4222:4222"]

volumes:
  nats-data:
