services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: inari
      POSTGRES_PASSWORD: inari
      POSTGRES_DB: inari
    ports: ["5432:5432"]

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./deploy/dev/keycloak:/opt/keycloak/data/import:ro
    ports: ["8081:8080"]

  openfga:
    image: openfga/openfga:v1.8
    command: run
    ports: ["8082:8080"]

  # NATS JetStream event bus (ADR-0014): obligatory — run the server with
  # INARI_NATS_URL=nats://localhost:4222.
  nats:
    image: nats:2.11-alpine
    command: ["-js", "-sd", "/data"]
    volumes:
      - nats-data:/data
    ports: ["4222:4222"]

volumes:
  nats-data:
