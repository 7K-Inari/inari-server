services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: inari
      POSTGRES_PASSWORD: inari
      POSTGRES_DB: inari
    ports: ["5432:5432"]

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./deploy/dev/keycloak:/opt/keycloak/data/import:ro
    ports: ["8081:8080"]

  openfga:
    image: openfga/openfga:v1.8
    command: run
    ports: ["8082:8080"]
