services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: inari
      POSTGRES_PASSWORD: inari
      POSTGRES_DB: inari
    ports: ["5432:5432"]

  keycloak:
    image: quay.io/keycloak/keycloak:26.8@sha256:b0f60d489d51c5d113390bdf5461d4c06e6051be026c05549f2e1e10ec352bcc
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./deploy/dev/keycloak:/opt/keycloak/data/import:ro
    ports: ["8081:8080"]

  openfga:
    image: openfga/openfga:v1.21@sha256:2113c664a486b5da8d7a2cdab479e0d4e30639c80fd2c000540f645c1dbc1e55
    command: run
    ports: ["8082:8080"]

  # NATS JetStream event bus (ADR-0014): obligatory — run the server with
  # INARI_NATS_URL=nats://localhost:4222.
  nats:
    image: nats:2.15-alpine@sha256:ac8f88a6494bffc2c2a5289a0ca61cb28a9145c11ba5677cf24265d07f46d8d4
    command: ["-js", "-sd", "/data"]
    volumes:
      - nats-data:/data
    ports: ["4222:4222"]

volumes:
  nats-data:
