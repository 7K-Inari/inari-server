apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.ServiceName }}
  namespace: {{ .Tenant.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.ServiceName }}
    inari.io/run: {{ .Run.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.ServiceName }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.ServiceName }}
    spec:
      containers:
        - name: service
          image: ghcr.io/example/{{ .Values.ServiceName }}:latest
          ports:
            - containerPort: {{ .Values.Port }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.Port }}
